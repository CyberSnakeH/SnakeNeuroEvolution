[project]
name = "snake-neat"
version = "0.1.0"
description = "Snake learned with NEAT (NeuroEvolution of Augmenting Topologies), numpy only, with a live Tkinter visualization."
readme = "README.md"
authors = [
    { name = "CyberSnakeH" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
]

keywords = ["neat", "neuroevolution", "genetic-algorithm", "snake", "reinforcement-learning", "numpy"]

[project.urls]
Repository = "https://github.com/CyberSnakeH/SnakeNeuroEvolution"

[project.scripts]
snake-neat = "snake_neat.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# The Tk bundled with uv-managed Python builds lacks Xft (bitmap fonts only),
# so the system interpreter is preferred for a properly rendered GUI.
python-preference = "system"
